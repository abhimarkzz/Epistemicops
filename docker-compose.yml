services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    pull_policy: always
    ports:
      - "8888:8888"   # REST API
      - "9999:9999"   # Web UI / control plane
    environment:
      # Tell Hindsight to use the Ollama instance running on the Docker host.
      # host.docker.internal resolves to the host on Mac; the extra_hosts
      # entry below makes the same name work on Linux.
      HINDSIGHT_API_LLM_PROVIDER: ollama
      HINDSIGHT_API_LLM_BASE_URL: http://host.docker.internal:11434/v1
      HINDSIGHT_API_LLM_MODEL: qwen3:8b
      HINDSIGHT_API_LLM_MAX_CONCURRENT: "1"
      # Observations must be enabled: the project relies on consolidation
      # and Mental Models for the warm-incident learning loop.
      HINDSIGHT_API_ENABLE_OBSERVATIONS: "true"
    volumes:
      # Hindsight stores its embedded database here.
      - hindsight_data:/home/hindsight/.pg0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  hindsight_data:
    driver: local
