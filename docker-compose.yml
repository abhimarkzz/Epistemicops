services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    pull_policy: always
    ports:
      - "8888:8888"   # REST API
      - "9999:9999"   # Web UI / control plane
    environment:
      # LLM Hindsight uses for fact extraction, reflect, and consolidation.
      # Defaults to Groq (free tier) with GROQ_API_KEY from your environment/.env,
      # so recall/consolidation work without a paid or quota-limited key.
      # To use Gemini instead: HINDSIGHT_LLM_PROVIDER=gemini,
      # HINDSIGHT_LLM_MODEL=gemini-3.8-flash, HINDSIGHT_LLM_API_KEY=${GEMINI_API_KEY}.
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_LLM_PROVIDER:-groq}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:-openai/gpt-oss-120b}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_LLM_API_KEY:-${GROQ_API_KEY}}
      HINDSIGHT_API_LLM_MAX_CONCURRENT: "1"
      # Observations must be enabled: the project relies on consolidation
      # and Mental Models for the warm-incident learning loop.
      HINDSIGHT_API_ENABLE_OBSERVATIONS: "true"
    volumes:
      # Hindsight stores its embedded database here.
      - hindsight_data:/home/hindsight/.pg0
    restart: unless-stopped

volumes:
  hindsight_data:
    driver: local
